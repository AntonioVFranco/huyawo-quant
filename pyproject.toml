[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huyawo-quant"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "huggingface-hub>=1.32,<2",
]

[project.optional-dependencies]
baseline = [
    "torch>=2.14,<3",
    "transformers>=5.17,<6",
]

quality = [
    "lm-eval[hf]==0.4.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["huyawo_quant", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["huyawo_quant", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["huyawo_quant*"]
namespaces = false
